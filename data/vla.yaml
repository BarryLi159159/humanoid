topic: vla
papers:
  - id: "2609.26420"
    name: "Sample-Simulate-Select"
    title: "Sample, Simulate, Select: Physics-in-the-Loop Text-to-Motion for Humanoids Without Training"
    venue: "arXiv"
    depth: A
    novelty: "Training-free: sample many text-to-motion candidates, simulate them through retarget + tracker, select by text-motion score."
    limitation: "Inference cost scales with candidate count; semantics can be lost at the retargeting/tracking stages."
  - id: "2609.23968"
    name: "Opt2VLA"
    title: "Opt2VLA: Force-Aware Vision-Language-Action for Contact-Rich Humanoid Whole-Body Manipulation"
    venue: "arXiv"
    depth: A
    novelty: "VLA outputs motion goals plus contact-force references; RL WBC tracks both; supervision comes from whole-body trajectory optimization, not teleop."
    limitation: "TO needs object/contact models; force-reference sim-to-real depends on contact modeling accuracy."
  - id: "2609.16644"
    name: "WholeBodyWAM"
    title: "WholeBodyWAM: Generalizing Pre-trained World-Action Priors to Humanoid Loco-Manipulation via WBC-Grounded Coordination"
    venue: "arXiv"
    depth: A
    novelty: "Grounds a pretrained world-action model in WBC commands instead of relearning whole-body behavior; lowers variance across different WBCs."
    limitation: "Performance still bounded by the underlying WBC; real-world gains reported as task progress rather than full success."
  - id: "2609.03889"
    name: "FWBC-VLA"
    title: "FWBC-VLA: Force-Aware Whole-Body Compensation for Contact-Rich Loco-Manipulation"
    venue: "arXiv"
    depth: T
    novelty: "Adds force-aware whole-body compensation beneath a VLA for contact-rich loco-manipulation."
    limitation: "Force signals inferred rather than measured at contacts."
  - id: "2608.16837"
    name: "HAF"
    title: "HAF: Adapting Generalist VLAs to Humanoid Whole-Body Loco-manipulation via Hierarchical Action Flow and Spectral Latent RL"
    venue: "arXiv"
    depth: A
    novelty: "Hierarchical action-flow head on a pretrained flow-matching VLA plus spectral latent RL to cheaply adapt generalist VLAs to whole-body humanoids."
    limitation: "Adaptation still requires humanoid demonstrations; relies on a separate low-level tracker."
  - id: "2606.22174"
    name: "OpenHLM"
    title: "OpenHLM: An Empirical Recipe for Whole-Body Humanoid Loco-Manipulation"
    venue: "arXiv"
    depth: A
    novelty: "Systematic recipe study: joint-space whole-body teleop beats partial-DoF and SMPL action spaces; non-humanoid pretraining transfers; HuMI co-training."
    limitation: "Single platform and a small task suite; conclusions about action spaces may be VLA-architecture dependent."
  - id: "2603.23983"
    name: "SafeFlow"
    title: "SafeFlow: Real-Time Text-Driven Humanoid Whole-Body Control via Physics-Guided Rectified Flow and Selective Safety Gating"
    venue: "arXiv"
    depth: T
    novelty: "Physics-guided rectified flow generates text-driven motions in real time; a gate rejects unsafe generations."
    limitation: "Gating reduces failures but also expressiveness; semantics limited to text-motion datasets."
  - id: "2603.12263"
    name: "Psi-0"
    title: "Psi-0: An Open Foundation Model Towards Universal Humanoid Loco-Manipulation"
    venue: "RSS 2026"
    depth: A
    novelty: "Pretrains on large-scale egocentric human video, then mid-trains an action expert on humanoid data; open model."
    limitation: "Human-to-humanoid action gap bridged only by staged training; relies on a separate low-level WBC."
  - id: "2602.07439"
    name: "TextOp"
    title: "TextOp: Real-time Interactive Text-Driven Humanoid Robot Motion Generation and Control"
    venue: "arXiv"
    depth: T
    novelty: "Streaming text-to-motion with real-time command editing driving a humanoid tracker."
    limitation: "Language only specifies motion style/content, not scene-grounded tasks."
  - id: "2601.12799"
    name: "FRoM-W1"
    title: "FRoM-W1: Towards General Humanoid Whole-Body Control with Language Instructions"
    venue: "arXiv"
    depth: T
    novelty: "Language instructions -> motion generation -> whole-body control stack aimed at general instruction following."
    limitation: "No visual scene grounding; generation quality bounds execution."
  - id: "2512.24321"
    name: "UniAct"
    title: "UniAct: Unified Motion Generation and Action Streaming for Humanoid Robots"
    venue: "arXiv"
    depth: T
    novelty: "Unifies multimodal motion generation with low-latency action streaming to the controller."
    limitation: "Streaming latency/robustness trade-offs on real hardware under network jitter."
  - id: "2512.11047"
    name: "WholeBodyVLA"
    title: "WholeBodyVLA: Towards Unified Latent VLA for Whole-body Loco-manipulation Control"
    venue: "ICLR 2026"
    depth: T
    novelty: "Unified latent action space learned partly from action-free video, paired with a loco-manipulation-oriented RL controller."
    limitation: "Latent actions are hard to interpret/debug; lower-body usage still constrained by controller interface."
  - id: "2511.22963"
    name: "Free-form LAM"
    title: "Commanding Humanoid by Free-form Language: A Large Language Action Model with Unified Motion Vocabulary"
    venue: "arXiv"
    depth: T
    novelty: "Large language-action model over a unified tokenized motion vocabulary for free-form commands."
    limitation: "Motion vocabulary quantization limits precision; no object grounding."
  - id: "2511.19236"
    name: "SENTINEL"
    title: "SENTINEL: A Fully End-to-End Language-Action Model for Humanoid Whole Body Control"
    venue: "arXiv"
    depth: T
    novelty: "End-to-end language-to-joint-action model without an explicit motion-generation intermediate."
    limitation: "End-to-end models need large paired data; tracking precision below dedicated trackers."
  - id: "2511.09241"
    name: "Scaling High-Level Control"
    title: "Unveiling the Impact of Data and Model Scaling on High-Level Control for Humanoid Robots"
    venue: "arXiv"
    depth: T
    novelty: "Empirical scaling study of high-level humanoid control w.r.t. data and model size."
    limitation: "Scaling trends measured within one pipeline; may not transfer to other interfaces."
  - id: "2510.14952"
    name: "RoboGhost"
    title: "From Language to Locomotion: Retargeting-free Humanoid Control via Motion Latent Guidance"
    venue: "ICLR 2026"
    depth: A
    novelty: "Student policy conditions only on the latent of a text-to-motion generator (no retargeting, no explicit keypoints); MoE teacher, diffusion student."
    limitation: "Tied to one generator's latent space; changing the generator requires retraining the student."
  - id: "2506.13751"
    name: "LeVERB"
    title: "LeVERB: Humanoid Whole-Body Control with Latent Vision-Language Instruction"
    venue: "arXiv"
    depth: T
    novelty: "Hierarchical: VLM produces a latent verb from vision+language; RL low-level policy decodes it; sim benchmark released."
    limitation: "Mostly sim-trained/evaluated; latent vocabulary bounded by synthetic data."
  - id: "2506.12769"
    name: "RLPF"
    title: "RL from Physical Feedback: Aligning Large Motion Models with Humanoid Control"
    venue: "arXiv"
    depth: T
    novelty: "Finetunes a large text-to-motion model with RL using tracking success as physical feedback."
    limitation: "Risk of catastrophic forgetting and reduced output diversity (noted by later work)."
  - id: "2504.21738"
    name: "LangWBC"
    title: "LangWBC: Language-directed Humanoid Whole-Body Control via End-to-end Learning"
    venue: "RSS 2025"
    depth: T
    novelty: "End-to-end language-conditioned whole-body policy via CVAE-based distillation from a tracker."
    limitation: "Poor scaling to unseen instructions; language space limited to training captions."
  - id: "2503.14734"
    name: "GR00T N1"
    title: "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots"
    venue: "arXiv"
    depth: A
    novelty: "Open dual-system VLA (VLM + DiT action head) trained on real, synthetic and human-video data for humanoids."
    limitation: "Mostly upper-body/tabletop; locomotion delegated to a separate controller."
  - id: "2503.12533"
    name: "Being-0"
    title: "Being-0: A Humanoid Robotic Agent with Vision-Language Models and Modular Skills"
    venue: "arXiv"
    depth: T
    novelty: "Agent framework: foundation model plans, a connector VLM grounds, modular skills execute."
    limitation: "Modular skills limit whole-body coordination; error accumulates across modules."
